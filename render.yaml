# Blueprint: CT fitness audit worker (poll cron) + nightly maintenance.
# Apply: https://dashboard.render.com/blueprint/new?repo=https://github.com/hsinsammy1218/ct-web-lead-agent
# Dashboard stays on Vercel; this worker writes audits into Supabase.
#
# Worker uses Docker (Playwright image) because `playwright install --with-deps`
# cannot use root/`su` on Render's native Node builder.
services:
  - type: cron
    name: ct-lead-audit
    runtime: docker
    plan: starter
    schedule: "*/5 * * * *"
    dockerfilePath: ./Dockerfile.worker
    dockerContext: .
    dockerCommand: npm run worker:once
    envVars:
      - key: DATA_DRIVER
        value: supabase
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        value: https://ytbdtfzdgncdupqzniba.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: OPERATOR_EMAILS
        sync: false
      - key: PAGESPEED_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: PLAYWRIGHT_ENABLED
        value: "true"
      - key: MONTHLY_API_CAP_USD
        value: "50"
      - key: DAILY_API_CAP_USD
        value: "5"
      - key: AI_QUALITY_THRESHOLD
        value: "70"
      - key: REAUDIT_DAYS
        value: "90"
      - key: SCREENSHOT_DIR
        value: /tmp/screenshots
      - key: SITE_GITHUB_OWNER
        value: hsinsammy1218
      - key: AUTO_PUBLISH_SITES
        value: "true"
      - key: GITHUB_TOKEN
        sync: false
      - key: VERCEL_TOKEN
        sync: false

  - type: cron
    name: ct-lead-maintenance
    runtime: node
    plan: starter
    schedule: "15 6 * * *"
    buildCommand: npm ci
    startCommand: npm run start -w @ct/worker -- --maintenance
    envVars:
      - key: DATA_DRIVER
        value: supabase
      - key: SUPABASE_URL
        value: https://ytbdtfzdgncdupqzniba.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: REAUDIT_DAYS
        value: "90"
